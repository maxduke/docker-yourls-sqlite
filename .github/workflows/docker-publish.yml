
name: Test and publish Docker image

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Docker Hub image tag"
        required: true
        type: string
        default: "1.10.6-sqlite1"

permissions:
  contents: read

jobs:
  test:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build test image
        run: docker build --pull -t yourls-sqlite:test .

      - name: Run integration tests
        run: bash tests/smoke.sh yourls-sqlite:test

  publish:
    name: Publish multi-arch image
    needs: test

    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: maxduke/yourls-sqlite:${{ inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
